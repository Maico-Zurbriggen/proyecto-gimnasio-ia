[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gym-analytics-engine"
version = "0.0.0"
description = "Servicio de IA generativa y motor analítico del Proyecto Gimnasio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.117,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "vercel-queue[typed]>=0.1,<1",
]

[project.optional-dependencies]
analytics = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "uvicorn>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gym_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["gym_engine"]
mypy_path = "src"

[[tool.vercel.subscribers]]
entrypoint = "gym_engine.worker.generation"
