[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gym-analytics-engine"
version = "0.0.0"
description = "Servicio de IA generativa y motor analítico del Proyecto Gimnasio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  # Pin acotado a 0.2.x a propósito: 0.6.x cambia los overloads de tipado de StateGraph.add_node
  # (CompiledStateGraph pasa a requerir type-arg) y rompe mypy en orchestration/graph.py -- no
  # migrado todavía, así que no dejar que un resolve sin lockfile salte de mayor.
  "langgraph>=0.2,<0.3",
  "vercel-queue>=0.9,<0.10",
]

[project.optional-dependencies]
analytics = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gym_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["gym_engine"]
mypy_path = "src"

[tool.vercel]
entrypoint = "src.gym_engine.api.app:app"

[[tool.vercel.subscribers]]
entrypoint = "gym_engine.worker.queue_consumer"
