[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gym-analytics-engine"
version = "0.0.0"
description = "Motor batch de análisis y machine learning del Proyecto Gimnasio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gym_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["gym_engine"]
mypy_path = "src"
