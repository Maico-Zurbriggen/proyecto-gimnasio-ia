name: Bug
description: Reportar un comportamiento incorrecto y reproducible.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: current
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y entorno
      description: Capturas, logs sanitizados, navegador, commit o ambiente.
